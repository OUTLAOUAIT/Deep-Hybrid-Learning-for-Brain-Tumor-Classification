[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-classification"
version = "0.1.0"
description = "Reproducible PyTorch brain tumor image classification research project"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "Pillow>=10.4,<13", "PyYAML>=6.0.2,<7", "pymatreader>=0.0.32,<1", "matplotlib>=3.7.5,<4"]

[project.optional-dependencies]
vision = ["torch>=2.5.0", "torchvision>=0.20.0", "timm>=1.0.15,<2"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
