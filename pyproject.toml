[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-classification"
version = "0.1.0"
description = "Reproducible PyTorch brain tumor image classification research project"
requires-python = ">=3.8"
dependencies = ["torch==2.0.1", "torchvision==0.15.2", "scikit-learn==1.3.2", "numpy==1.24.4", "Pillow==10.4.0", "PyYAML==6.0.2", "pymatreader==0.0.32"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
